name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        run: python -m pytest backend/tests/ -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Project/package-lock.json

      - name: Install dependencies
        working-directory: Project
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        working-directory: Project
        run: npm run test:unit

      - name: Ensure environment configuration exists
        working-directory: Project
        run: |
          if [ ! -f src/environments/environment.prod.ts ]; then
            cp src/environments/environment.example.ts src/environments/environment.prod.ts || cp src/environments/environment.ts src/environments/environment.prod.ts
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Ionic Angular frontend
        working-directory: Project
        run: npm run build -- --base-href /Itinerary-App/

      - name: Prepare SPA routing for GitHub Pages
        run: |
          touch Project/www/.nojekyll
          cp Project/www/index.html Project/www/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Project/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

