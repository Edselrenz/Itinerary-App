name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Project/package-lock.json

      - name: Install dependencies
        working-directory: Project
        run: npm ci

      - name: Ensure environment configuration exists
        working-directory: Project
        run: |
          if [ ! -f src/environments/environment.prod.ts ]; then
            cp src/environments/environment.example.ts src/environments/environment.prod.ts || cp src/environments/environment.ts src/environments/environment.prod.ts
          fi

      - name: Build Ionic Angular frontend
        working-directory: Project
        run: npm run build -- --base-href ./

      - name: Prepare SPA routing for GitHub Pages
        run: |
          touch Project/www/.nojekyll
          cp Project/www/index.html Project/www/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Project/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

