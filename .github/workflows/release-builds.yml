name: Build Android APK & Windows Desktop Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version label for installer & APK artifacts (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish_release:
        description: 'Create/Update a GitHub Release when triggered manually'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Capacitor Android APK (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Project/package-lock.json

      - name: Setup Java JDK 21 (Required by Capacitor 8 Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install frontend dependencies
        working-directory: Project
        run: npm ci

      - name: Build production Ionic Angular bundle (Service Worker disabled for native APK)
        working-directory: Project
        run: npx ng build --configuration production --no-service-worker

      - name: Sync web assets and Capacitor plugins to Android
        working-directory: Project
        run: npx cap sync android

      - name: Build Debug APK (TripMoTripKo-debug.apk)
        working-directory: Project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../dist_apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist_apk/TripMoTripKo-debug.apk

      - name: Build Signed Release APK (if ANDROID_KEYSTORE_BASE64 secret is configured)
        working-directory: Project/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Detected ANDROID_KEYSTORE_BASE64 secret; configuring release signing..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ../nueva-ecija-travel-release.jks
            cat <<EOF > keystore.properties
          storeFile=../nueva-ecija-travel-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../dist_apk/TripMoTripKo-release-signed.apk
            rm -f ../nueva-ecija-travel-release.jks keystore.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; skipping signed release APK (TripMoTripKo-debug.apk is ready to install)."
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-artifacts
          path: dist_apk/*.apk
          retention-days: 30

  build-windows-installer:
    name: Build Flet Desktop Standalone & Inno Setup Installer (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: desktop_client/requirements.txt

      - name: Install Python & PyInstaller packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller pillow
          python -m pip install -r desktop_client/requirements.txt

      - name: Provision Flet Desktop Windows Engine & Compile PyInstaller Bundle
        shell: pwsh
        run: |
          python -c "import flet_desktop; print('Cached Flet Client:', flet_desktop.ensure_client_cached())"
          python scripts/build_standalone_exe.py

      - name: Compile Single-File Setup.exe via Inno Setup 6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          $IsccExe = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $IsccExe)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y
          }
          & $IsccExe "installer\\NuevaEcijaTravel.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          Compress-Archive -Path "dist\\NuevaEcijaTravel\\*" -DestinationPath "dist_installer\\NuevaEcijaTravel_Portable_v1.0.0.zip" -Force
          Get-ChildItem dist_installer

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-installer
          path: |
            dist_installer/*.exe
            dist_installer/*.zip
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release Assets
    needs: [build-android-apk, build-windows-installer]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk-artifacts
          path: release_assets

      - name: Download Windows Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-installer
          path: release_assets

      - name: Generate SHA-256 Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.version_tag || 'v1.0.0' }}
          name: Trip Mo, Trip Ko ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.version_tag || 'v1.0.0' }}
          generate_release_notes: true
          files: |
            release_assets/*
