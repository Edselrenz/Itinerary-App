services:
  postgres:
    image: postgres:16-alpine
    container_name: ne_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ne_travel_user
      POSTGRES_PASSWORD: change_me_local_only
      POSTGRES_DB: nueva_ecija_travel
    volumes:
      - ne_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ne_travel_user -d nueva_ecija_travel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ne_postgres_data:
    driver: local

