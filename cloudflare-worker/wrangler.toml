name = "nueva-ecija-itinerary-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV Namespace binding to persist active laptop tunnel endpoints
# To create the KV namespace:
#   npx wrangler kv:namespace create TUNNEL_KV
# Then paste the generated id below:
[[kv_namespaces]]
binding = "TUNNEL_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"

[vars]
# You can set secrets via:
#   npx wrangler secret put ADMIN_SYNC_KEY
# Or provide a default dev key:
ADMIN_SYNC_KEY = "ne_pilot_secret_key_change_me"
